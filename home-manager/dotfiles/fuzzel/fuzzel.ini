[main]
# Sizes are in pt/CSS px and get multiplied by the sway output scale (1.5), so
# they are ~2/3 of the scale-1.0 values: 11pt -> 22px on screen.
font=FiraCode Nerd Font:size=11
icons-enabled=yes
icon-theme=Adwaita
prompt="❯ "
layer=overlay
width=55
lines=10
horizontal-pad=15
vertical-pad=11
inner-pad=6
line-height=18

[colors]
background=282828ee
text=ebdbb2ff
match=fabd2fff
selection=3c3836ff
selection-text=fabd2fff
selection-match=fe8019ff
border=458588ff

[border]
width=2
radius=10
